
name: Build PinkNotepad APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE="PinkNotepad_2.0_%EC%95%84%EC%9D%B4%EC%BD%98%ED%8F%AC%ED%95%A8_%EC%98%A4%EB%A5%98%EC%88%98%EC%A0%95.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP 파일을 찾을 수 없습니다."
            ls -la
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinkNotepad-APK
          path: app/build/outputs/apk/debug/app-debug.apk
