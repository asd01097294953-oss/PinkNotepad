
name: Build PinkNotepad APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE="PinkNotepad_2.0_%EC%95%84%EC%9D%B4%EC%BD%98%ED%8F%AC%ED%95%A8_%EC%98%A4%EB%A5%98%EC%88%98%EC%A0%95.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP 파일을 찾을 수 없습니다."
            ls -la
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix JVM targets
        run: |
          FILE="app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "Gradle 파일을 찾을 수 없습니다."
            find . -name "build.gradle.kts"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          s = re.sub(
              r'compileOptions\s*\{[^{}]*\}',
              '',
              s
          )
          s = re.sub(
              r'kotlinOptions\s*\{[^{}]*\}',
              '',
              s
          )

          pos = s.find("android {")
          if pos == -1:
              raise SystemExit("android 블록을 찾을 수 없습니다.")

          brace = s.find("{", pos)
          depth = 1
          i = brace + 1

          while depth > 0 and i < len(s):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
              i += 1

          if depth != 0:
              raise SystemExit("android 블록이 올바르지 않습니다.")

          s = s[:brace+1] + "\n" + block + s[brace+1:]
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinkNotepad-APK
          path: app/build/outputs/apk/debug/app-debug.apk
