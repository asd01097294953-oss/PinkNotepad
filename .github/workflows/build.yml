
name: Build PinkNotepad APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name 'PinkNotepad_2.0_아이콘포함_오류수정.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "아이콘 포함 ZIP 파일을 찾을 수 없습니다."
            ls -la
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinkNotepad-APK
          path: app/build/outputs/apk/debug/app-debug.apk
